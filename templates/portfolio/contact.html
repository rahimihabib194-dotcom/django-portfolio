{% extends "base.html" %}
{% block title %}تماس | حبیب‌الله رحیمی{% endblock %}

{% block content %}

        <h2>تماس با من</h2>
        <p>پیامت را بفرست؛ مستقیم میاد توی دیتابیس من!</p>

    </div>

{% endblock %}
